<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CAPTCHA COM GRETCHEN</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="captcha">

        <!-- Cabeçalho -->
        <div class="cabecalho">

            <p>Descubra o padrão correto </p>

            <h1>Qual a sequência de Gretchen?</h1>

        </div>


        <!-- Imagem + matriz -->
        <div class="imagem-container">

            <img
                src="meme_gretchen.png"
                alt="Grade com imagens"
            >

            <div id="grade"></div>

        </div>


        <!-- Área dos botões -->
        <div class="rodape">

            <button id="atualizar">
                ↻
            </button>

            <button id="verificar">
                VERIFICAR
            </button>

        </div>


        <!-- Mensagem -->
        <p id="resultado"></p>

    </div>


    <script src="script.js"></script>

</body>

</html>
